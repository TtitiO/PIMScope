name: clean-clone-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PIMScope and pinned Ramulator submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-format cmake python3-dev python3-venv

      - name: Create environment and install packages
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip setuptools wheel
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m pip install -r ramulator2/requirements-dev.txt
          .venv/bin/python -m pip install --no-build-isolation -e ramulator2

      - name: Build runtime and optional test bindings
        run: |
          cmake -S ramulator2 -B ramulator2/build-ci \
            -DPython_EXECUTABLE="$PWD/.venv/bin/python" \
            -DRAMULATOR_TEST_BINDINGS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ramulator2/build-ci -j2

      - name: Verify generated code did not change tracked sources
        run: git -C ramulator2 diff --exit-code

      - name: Run project-owned regression tests
        working-directory: ramulator2
        run: |
          ../.venv/bin/python -m pytest -q \
            tests/controller_scheduling \
            tests/device_timings \
            tests/smoke \
            tests/unit_tests \
            tests/test_LPDDR5_params.py \
            tests/test_lpddr5_pim_config.py \
            tests/test_lpddr5_pim_addressing.py \
            tests/test_REFpb.py \
            tests/pimscope

      - name: Run examples and artifact CLI checks
        run: |
          (cd ramulator2 && ../.venv/bin/python examples/example_config.py)
          (cd ramulator2 && ../.venv/bin/python examples/lpddr5_pim_example_config.py)
          (cd ramulator2 && ../.venv/bin/python examples/pimscope_experiment.py)
          .venv/bin/ramulator-pimscope validate ramulator2/examples/pimscope_custom_model.json
          .venv/bin/ramulator-pimscope run ramulator2/examples/pimscope_custom_model.json \
            --output /tmp/ramulator-pimscope-result.json
          .venv/bin/pimscope-artifacts --help
          .venv/bin/pimscope --help
          .venv/bin/pimscope doctor --config configs/example_custom.json
          .venv/bin/pimscope validate configs/example_custom.json
          .venv/bin/pimscope run configs/example_custom_model.json \
            --output /tmp/pimscope-custom-model.json
          .venv/bin/pimscope validate-result /tmp/pimscope-custom-model.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from ramulator.pimscope import validate_aggregate
          payload = {
              "schema_version": 1,
              "schema_name": "pimscope-decode-aggregate-v1",
              "phase": "decode",
              "rows": [{"cycles": 1, "runtime_ns": 1.0, "replay_status": "PASS"}],
          }
          validate_aggregate(payload, kind="decode_cycles")
          Path("/tmp/pimscope-aggregate-check.json").write_text(
              json.dumps(payload) + "\\n", encoding="utf-8"
          )
          PY
          .venv/bin/pimscope validate-aggregate \
            /tmp/pimscope-aggregate-check.json --kind decode_cycles
          if .venv/bin/pimscope validate configs/example_custom.json \
            --set hardware.topology.channels=2 >/tmp/unsupported-topology.out 2>/tmp/unsupported-topology.err; then
            echo "unsupported multi-channel topology unexpectedly validated" >&2
            exit 1
          fi
          grep -q "hardware.topology.channels" /tmp/unsupported-topology.err
          .venv/bin/python scripts/gen_figures.py --help
          .venv/bin/python -m pytest -q tests

      - name: Check clean parent tree
        run: git diff --exit-code
